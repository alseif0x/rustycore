[package]
name = "world-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Target-only native name engine. No Boost dependency in the legacy runtime.
forever-name-regex = ["dep:cc"]
# IDs-only source container replay; no C++ gameplay or legacy dependency.
forever-spell-traversal = ["dep:cc"]
# Source SFMT/frand startup capability; never the legacy Rust RNG.
forever-spell-random = ["dep:cc"]

[[bin]]
name = "world-server"
path = "src/main.rs"

[[bin]]
name = "forever-world-server"
path = "src/forever/main.rs"
required-features = ["forever-name-regex", "forever-spell-traversal", "forever-spell-random"]

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
flume = { workspace = true }
wow-core = { workspace = true }
wow-config = { workspace = true }
wow-logging = { workspace = true }
wow-data = { workspace = true }
wow-database = { workspace = true }
wow-persistence = { workspace = true }
wow-loot = { workspace = true }
wow-movement = { workspace = true }
wow-network = { workspace = true }
wow-module-api = { workspace = true }
wow-world = { workspace = true }
wow-handler = { workspace = true }
wow-instances = { workspace = true }
wow-packet = { workspace = true }
wow-constants = { workspace = true }
wow-crypto = { workspace = true }
wow-entities = { workspace = true }
wow-map = { workspace = true }
wow-scripts = { workspace = true }
wow-social = { workspace = true }

[dev-dependencies]
wow-world = { workspace = true, features = ["test-fixtures"] }

[build-dependencies]
cc = { version = "1", optional = true }
