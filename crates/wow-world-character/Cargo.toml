[package]
name = "wow-world-character"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The login-load and gossip entry points the World scenarios reach through their
# `#![cfg(test)]` shim files (#1363 slices 8d and 8e). The feature forwards to
# every fixture-bearing wow-world dependency, and the self dev-dependency below
# turns it on for character's own test build, so a standalone
# `cargo check -p wow-world-character [-p wow-world-spell] --all-targets` builds
# them cfg-aligned with `wow-world-core/test-fixtures` (#1389 review follow-up 1).
test-fixtures = [
    "wow-world-core/test-fixtures",
    "wow-world-entities/test-fixtures",
    "wow-world-interaction/test-fixtures",
    "wow-world-instances/test-fixtures",
    "wow-world-inventory/test-fixtures",
    "wow-world-lifecycle/test-fixtures",
    "wow-world-loot/test-fixtures",
    "wow-world-spell/test-fixtures",
    "wow-world-visibility/test-fixtures",
]

[dependencies]
flume = { workspace = true }
num-traits = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
wow-conditions = { workspace = true }
wow-config = { workspace = true }
wow-constants = { workspace = true }
wow-core = { workspace = true }
wow-data = { workspace = true }
wow-entities = { workspace = true }
wow-handler = { workspace = true }
wow-network = { workspace = true }
wow-packet = { workspace = true }
wow-persistence = { workspace = true }
wow-progression = { workspace = true }
wow-world-core = { workspace = true }
wow-world-entities = { workspace = true }
wow-world-instances = { workspace = true }
wow-world-interaction = { workspace = true }
wow-world-inventory = { workspace = true }
wow-world-lifecycle = { workspace = true }
wow-world-loot = { workspace = true }
wow-world-spell = { workspace = true }
wow-world-visibility = { workspace = true }

[dev-dependencies]
wow-world-character = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
