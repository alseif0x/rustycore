[package]
name = "wow-world-quest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-fixtures = [
    "wow-world-core/test-fixtures",
    "wow-world-entities/test-fixtures",
    "wow-world-instances/test-fixtures",
    "wow-world-inventory/test-fixtures",
    "wow-world-lifecycle/test-fixtures",
    "wow-world-loot/test-fixtures",
    "wow-world-player-conditions/test-fixtures",
    "wow-world-social/test-fixtures",
    "wow-world-spell/test-fixtures",
]

[dependencies]
tracing = { workspace = true }
wow-conditions = { workspace = true }
wow-constants = { workspace = true }
wow-core = { workspace = true }
wow-data = { workspace = true }
wow-entities = { workspace = true }
wow-handler = { workspace = true }
wow-loot = { workspace = true }
wow-packet = { workspace = true }
wow-persistence = { workspace = true }
wow-progression = { workspace = true }
wow-script = { workspace = true }
wow-world-core = { workspace = true }
wow-world-entities = { workspace = true }
wow-world-instances = { workspace = true }
wow-world-inventory = { workspace = true }
wow-world-lifecycle = { workspace = true }
wow-world-loot = { workspace = true }
wow-world-player-conditions = { workspace = true }
wow-world-social = { workspace = true }
wow-world-spell = { workspace = true }

[dev-dependencies]
# Keep the quest crate and its concrete participants cfg-aligned in all-targets tests.
wow-world-quest = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
