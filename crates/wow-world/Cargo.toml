[package]
name = "wow-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Directory fixture helpers for cross-crate tests; never enabled in production.
test-fixtures = []
forever-navigation = ["dep:forever-navigation"]

[dependencies]
tokio = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
flume = { workspace = true }
inventory = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
wow-core = { workspace = true }
wow-config = { workspace = true }
wow-crypto = { workspace = true }
wow-constants = { workspace = true }
wow-anticheat = { workspace = true }
wow-ai = { workspace = true }
wow-chat = { workspace = true }
wow-data = { workspace = true }
wow-entities = { workspace = true }
wow-network = { workspace = true }
wow-logging = { workspace = true }
wow-loot = { workspace = true }
wow-map = { workspace = true }
wow-module-api = { workspace = true }
wow-movement = { workspace = true }
wow-recastdetour = { workspace = true }
wow-packet = { workspace = true }
wow-persistence = { workspace = true }
wow-handler = { workspace = true }
wow-session = { workspace = true }
wow-instances = { workspace = true }
wow-script = { workspace = true }
wow-social = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
forever-navigation = { path = "../../../rustycore-extractors/crates/forever-navigation", version = "=0.1.0", optional = true, default-features = false }

[dev-dependencies]
wow-data = { workspace = true, features = ["test-fixtures"] }
wow-session = { workspace = true, features = ["test-support"] }
# Real Detour navmesh fixtures for the live creature-pathfinding regressions.
wow-recastdetour = { workspace = true, features = ["test-fixtures"] }
forever-casc = { path = "../../../rustycore-extractors/crates/forever-casc", version = "=0.1.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
