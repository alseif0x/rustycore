[package]
name = "wow-test-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "cookies", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
aes-gcm = "0.10"
openssl = "0.10"
mysql = "25.0"
flate2 = "1"

[[bin]]
name = "wow-test-bot"
path = "src/main.rs"
