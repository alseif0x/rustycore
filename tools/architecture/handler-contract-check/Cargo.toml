[package]
name = "handler-contract-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false
default-run = "handler-contract-check"

[workspace]

[dependencies]
# span-locations gives Span::byte_range(), which lets a `#[path]` module be
# spliced back into its parent by exact byte range instead of regenerating the
# parent from its AST and losing the original text.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

# The architecture gate runs in release because a full workspace scan is the
# job's dominant cost, but its debug assertions cross-check the semantic row
# counts against the exact inventory. Keep them: the scan stays optimized and
# the safety net survives the profile change. Incremental release compilation
# turns the ~190 s rebuild after each checker change into a few seconds; the
# scan itself is measured separately before adopting it.
[profile.release]
debug-assertions = true
incremental = true

# The unit-test suite repeats full workspace scans (handler contract, bridge
# provenance, runtime ledger anchors, session ownership). Under the default
# unoptimized test profile, syn/proc-macro2 parsing dominated final's wall time.
# Optimizing the dependencies keeps every test, debug assertion and overflow
# check of this crate while removing that cost.
[profile.dev.package."*"]
opt-level = 3
