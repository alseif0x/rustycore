[package]
name = "execution-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmtime = { version = "=47.0.3", default-features = false, features = ["runtime", "cranelift", "std", "wat"] }

[profile.release]
debug = 1
