[workspace]
resolver = "2"
members = ["contract", "host", "modules/encounter", "modules/policy", "modules/expedition", "driver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
conformance-contract = { path = "contract" }
conformance-host = { path = "host" }
conformance-encounter = { path = "modules/encounter" }
conformance-policy = { path = "modules/policy" }
conformance-expedition = { path = "modules/expedition" }
hecs = "=0.11.1"
wasmtime = { version = "=47.0.3", default-features = false, features = ["runtime", "cranelift", "std", "wat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 1
