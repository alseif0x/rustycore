name: Full validator comparison
on:
  pull_request:
    branches: ["3.4.3"]
permissions:
  actions: read
  contents: read
jobs:
  comparison:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/full-validation-1494'
    name: ${{ matrix.implementation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        implementation: [reference, replacement-build, replacement-policy]
    env:
      VALIDATION_V2_CARGO_JOBS: "2"
      IMPLEMENTATION: ${{ matrix.implementation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the validator and check out the auction candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new"
          git archive ece799de10174a2d6745f132fff2fa971e9225a7 \
            tools/validate-full tools/ci/full_policy.py tools/ci/full_snapshot.py \
            tools/ci/check_doc_links.py tools/full-validation | tar -xf - -C "$RUNNER_TEMP/new"
          git switch --detach 316a7387cbaa77bf8a4e2160745f3b5a2020c304
          git rev-parse HEAD
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: validation-v2
          save-if: 'false'
          workspaces: |
            . -> target
      - name: Install inputs for the auction and database contracts
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          command -v rg
          curl -fsSL --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "0ad949f04a6a174da83cdcbdb36dee0a4925272a5b6d83f79a6bf9852076d53f  $RUNNER_TEMP/protoc.zip" | sha256sum -c
          python3 -m zipfile -e "$RUNNER_TEMP/protoc.zip" "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          export RUSTYCORE_CPP_REFERENCE_ROOT="$RUNNER_TEMP/cpp-reference"
          echo "RUSTYCORE_CPP_REFERENCE_ROOT=$RUSTYCORE_CPP_REFERENCE_ROOT" >> "$GITHUB_ENV"
          cpp_path=src/server/database/Database/Implementation
          mkdir -p "$RUSTYCORE_CPP_REFERENCE_ROOT/$cpp_path"
          cd "$RUSTYCORE_CPP_REFERENCE_ROOT/$cpp_path"
          for file in CharacterDatabase.cpp HotfixDatabase.cpp; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/TrinityCoreLegacy/TrinityCore/92796557f9b0ba3d2d1c7c770f535153154cf83e/$cpp_path/$file" -o "$file"
          done
          echo '1bc7a3647d8cf5646ad9e0a7ed2a6d9e88f6a6de21bd3b329cc52725b40c89f9  CharacterDatabase.cpp' | sha256sum -c
          echo '7c224e902a3a11743d60432f0975e86994eabe521dd1d49708db5ad17cb52097  HotfixDatabase.cpp' | sha256sum -c
      - name: Validate the reference implementation
        if: matrix.implementation == 'reference'
        shell: bash
        run: |
          set -euo pipefail
          base=31841d89165fb71eac6b106b63d3f3317bafbdf7
          cargo fetch --locked
          cargo fetch --locked --manifest-path tools/architecture/handler-contract-check/Cargo.toml
          ./tools/validation-v2 final --base "$base" --require-changes --architecture --timings --logs
      - name: Validate replacement build checks
        if: matrix.implementation == 'replacement-build'
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS="$(nproc)"
          "$RUNNER_TEMP/new/tools/validate-full" --base 31841d89165fb71eac6b106b63d3f3317bafbdf7 --part build --report "$RUNNER_TEMP/replacement-build-result.json"
      - name: Validate replacement policy checks
        if: matrix.implementation == 'replacement-policy'
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS="$(nproc)"
          "$RUNNER_TEMP/new/tools/validate-full" --base 31841d89165fb71eac6b106b63d3f3317bafbdf7 --part policy --report "$RUNNER_TEMP/replacement-policy-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.implementation }}-auction
          path: |
            ${{ runner.temp }}/*-result.json
            target/validation-v2/manifests/*.json
            target/validation-v2/logs/**
          if-no-files-found: warn
  verdict:
    if: always()
    needs: comparison
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate all comparison arms and report wall time
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARISON_RESULT: ${{ needs.comparison.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import datetime
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          api = "https://api.github.com/repos/{}/actions/runs/{}".format(repository, run_id)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          run = get_json(api)
          jobs = get_json(api + "/jobs?per_page=100")["jobs"]
          new_jobs = [job for job in jobs if job["name"] in {"replacement-build", "replacement-policy"}]
          if len(new_jobs) != 2 or any(not job.get("completed_at") for job in new_jobs):
              raise SystemExit("Both replacement jobs must finish before wall time can be measured.")
          start = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          final_new = max(datetime.datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00")) for job in new_jobs)
          seconds = int((final_new - start).total_seconds())
          print("Queued run to later replacement completion: {} s (from run created_at {} to {}).".format(seconds, run["created_at"], final_new.isoformat()))
          print("Comparison result: {}.".format(os.environ["COMPARISON_RESULT"]))
          print("Runner-minute tradeoff: three parallel VMs (reference, replacement build, replacement policy) versus two before; splitting the replacement adds one runner's elapsed minutes while the new checks overlap.")
          PY
          if [[ "$COMPARISON_RESULT" != success ]]; then
            echo "At least one of reference, replacement-build, or replacement-policy failed: $COMPARISON_RESULT" >&2
            exit 1
          fi
