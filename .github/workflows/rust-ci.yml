name: Rust CI

on:
  pull_request:
    branches:
      - "3.4.3"
  push:
    branches:
      - "3.4.3"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "268435456"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Architecture baselines are pinned to exact ancestor commits.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Install preflight dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Validate local preflight harness
        run: ./tools/pr-preflight.sh self-test

      - name: Check formatting
        run: |
          cargo +1.88.0 fmt --all --check
          cargo +1.88.0 fmt --manifest-path tools/wow-test-bot/Cargo.toml -- --check
          cargo +1.88.0 fmt --manifest-path tools/architecture/handler-contract-check/Cargo.toml -- --check

  check:
    name: Check core crates
    runs-on: ubuntu-24.04
    # The exact persistence inventory is intentionally scanned both by its
    # repository test and by the boundary command before the core build. A
    # single full scan measures ~36 minutes locally, so the two scans plus the
    # core build and clippy steps exhausted a 60-minute budget exactly; keep
    # every intentional validation and give the job room instead.
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Architecture baselines are pinned to exact ancestor commits.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          protoc_version="$(tr -d '[:space:]' < .protoc-version)"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
          python3 -m zipfile -e /tmp/protoc.zip "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check architecture boundaries
        run: |
          python3 tools/architecture/check_architecture.py check
          cargo +1.88.0 test --locked --manifest-path tools/architecture/handler-contract-check/Cargo.toml
          cargo +1.88.0 run --locked --manifest-path tools/architecture/handler-contract-check/Cargo.toml -- check

      # The combined check compares the session surface before the persistence
      # snapshot, so a session-only mismatch must not launch the long scan
      # below. Publish the baseline only when the persistence comparison is
      # what failed.
      - name: Check persistence and session ownership ratchets
        id: ratchets
        run: |
          set +e
          report="$(cargo +1.88.0 run --locked --manifest-path tools/architecture/handler-contract-check/Cargo.toml --bin session-ownership-check -- check 2>&1)"
          status=$?
          printf '%s\n' "$report"
          if [ "$status" -ne 0 ] && printf '%s' "$report" | grep -q "direct persistence"; then
            echo "persistence_mismatch=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      # Regenerating the exact persistence baseline takes about 36 minutes, so
      # a failed ratchet would otherwise send the author back to a long local
      # scan just to see what the checker now computes. Publish it instead —
      # but only for a ratchet mismatch, never after an unrelated failure that
      # the author is already waiting to read.
      - name: Publish recomputed persistence baseline
        if: failure() && steps.ratchets.outputs.persistence_mismatch == 'true'
        run: |
          cargo +1.88.0 run --locked --manifest-path tools/architecture/handler-contract-check/Cargo.toml \
            --bin session-ownership-check -- print-persistence-baseline \
            > "${RUNNER_TEMP}/persistence-access-snapshot.json"
          # The semantic policy is a pure function of the reviewed annotations
          # and this snapshot, so derive it here rather than paying for a
          # second workspace scan. Publishing the snapshot alone would hand the
          # author a policy that the next run rejects as stale — and a stale
          # policy never reaches this step, because only a persistence
          # mismatch does.
          cargo +1.88.0 run --locked --manifest-path tools/architecture/handler-contract-check/Cargo.toml \
            --bin session-ownership-check -- print-persistence-policy \
            --from-snapshot "${RUNNER_TEMP}/persistence-access-snapshot.json" \
            > "${RUNNER_TEMP}/persistence-boundary-policy.json"

      - name: Upload recomputed persistence baseline
        if: failure() && steps.ratchets.outputs.persistence_mismatch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: persistence-access-snapshot
          path: |
            ${{ runner.temp }}/persistence-access-snapshot.json
            ${{ runner.temp }}/persistence-boundary-policy.json
          if-no-files-found: ignore

      - name: Cargo check
        run: |
          cargo +1.88.0 check --locked -p wow-data -p wow-database -p wow-network -p wow-world -p bnet-server -p world-server
          cargo +1.88.0 check --locked --manifest-path tools/wow-test-bot/Cargo.toml
          cargo +1.88.0 build --locked -j1 -p bnet-server -p world-server

      - name: Clippy loot authority boundary
        run: cargo +1.88.0 clippy --locked --no-deps --message-format short -p wow-loot -p wow-entities -p wow-map -p wow-network --lib

      - name: Clippy world target with inherited debt capped
        run: cargo +1.88.0 clippy --locked --no-deps --message-format short -p wow-world --lib -- --cap-lints warn

  tests:
    name: Focused library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          protoc_version="$(tr -d '[:space:]' < .protoc-version)"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
          python3 -m zipfile -e /tmp/protoc.zip "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run focused library and loot-race harness tests
        run: |
          cargo +1.88.0 test --locked -p wow-data --lib
          cargo +1.88.0 test --locked -p wow-handler --test inventory_registry
          cargo +1.88.0 test --locked -p wow-packet --lib
          cargo +1.88.0 test --locked -p wow-loot --lib
          cargo +1.88.0 test --locked -p wow-entities --lib
          cargo +1.88.0 test --locked -p wow-map --lib
          cargo +1.88.0 test --locked -p wow-network --lib
          cargo +1.88.0 test --locked -p wow-world --lib
          cargo +1.88.0 test --locked -p wow-world --test production_handler_registry_contract
          cargo +1.88.0 test --locked --manifest-path tools/wow-test-bot/Cargo.toml loot_race::tests
          cargo +1.88.0 test --locked -p capture-diff
          cargo +1.88.0 run --locked -p capture-diff -- verify-required loot-single-item-claim
          cargo +1.88.0 run --locked -p capture-diff -- verify-required creature-spell-casting

  latest-stable:
    name: Latest stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: latest-stable

      - name: Install protoc
        run: |
          protoc_version="$(tr -d '[:space:]' < .protoc-version)"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
          python3 -m zipfile -e /tmp/protoc.zip "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check and link server binaries on latest stable
        run: |
          cargo +stable check --locked -p bnet-server -p world-server
          cargo +stable build --locked -p bnet-server -p world-server
