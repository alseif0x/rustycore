name: Rust CI

on:
  pull_request:
    branches:
      - "3.4.3"
  push:
    branches:
      - "3.4.3"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Check formatting
        run: ./tools/pr-preflight.sh format

  check:
    name: Check core crates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          protoc_version="$(tr -d '[:space:]' < .protoc-version)"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
          python3 -m zipfile -e /tmp/protoc.zip "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cargo check
        run: ./tools/pr-preflight.sh check

  tests:
    name: Focused library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          protoc_version="$(tr -d '[:space:]' < .protoc-version)"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
          python3 -m zipfile -e /tmp/protoc.zip "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run packet/data/world tests
        run: ./tools/pr-preflight.sh test

  latest-stable:
    name: Latest stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: latest-stable

      - name: Install protoc
        run: |
          protoc_version="$(tr -d '[:space:]' < .protoc-version)"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
          python3 -m zipfile -e /tmp/protoc.zip "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check and link server binaries on latest stable
        run: ./tools/pr-preflight.sh stable
